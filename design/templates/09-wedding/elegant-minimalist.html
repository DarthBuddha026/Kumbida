<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elegant and Minimalist invitation</title>
<script src="../../runtime/dc-lite.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Montserrat:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<template id="dc-root"><x-dc>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAF8F3; color: #1C1C1C; font-family: Montserrat, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 70px 40px 0">
  <div style="position: absolute; left: 18px; top: 18px; right: 18px; bottom: 18px; border: 1px solid {{line}}"></div>

  <p style="position: relative; margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.4em">THE WEDDING OF</p>
  <h1 style="position: relative; margin: 26px 0 0; display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1; font-family: Cormorant, serif; font-weight: 400">
    <span style="font-size: 52px">The Happy</span>
    <span style="font-size: 52px; font-style: italic">Couple</span>
  </h1>
  <span aria-hidden="true" style="position: relative; margin-top: 28px; width: 40px; height: 1px; background: {{line}}"></span>

  <div style="position: relative; margin-top: 28px; width: 220px; height: 280px; background: #ECE8DF; display: flex; align-items: center; justify-content: center; font-family: Cormorant, serif; font-style: italic; font-size: 17px; color: #5C5C5C">Couple's photo</div>

  <p style="position: relative; margin: 30px 0 0; font-family: Cormorant, serif; font-size: 22px; line-height: 1.4">[Day], [Month Day]<br>[Year]</p>
  <p style="position: relative; margin: 12px 0 0; font-size: 12px; letter-spacing: 0.28em">[TIME] · [VENUE NAME], [CITY]</p>
  <a href="#" style="position: relative; margin-top: 26px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 34px; border: 1px solid #1C1C1C; color: #1C1C1C; font-size: 12px; font-weight: 500; letter-spacing: 0.32em; text-decoration: none">RSVP BY [DATE]</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"line":{"editor":"color","default":"#A8956B","options":["#A8956B","#1C1C1C","#8E9C8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { line: this.props.line ?? '#A8956B' }; }
}
</script></template>

</body>
</html>
