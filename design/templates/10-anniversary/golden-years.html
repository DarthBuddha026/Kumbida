<!doctype html>
<html lang="en">
<head>

<title>Golden Years invitation</title>
<script src="../../runtime/dc-lite.js"></script>

<style>body{margin:0}</style>

<body>
<template id="dc-root"><x-dc>

    <rect x="20" y="20" width="350" height="804" fill="none" stroke="{{accent}}" stroke-width="1"/>
    <g transform="translate(195 330)" fill="none" stroke="{{accent}}" stroke-width="1.5">
      <path d="M-120 60 C -150 0, -140 -70, -96 -120"/><path d="M120 60 C 150 0, 140 -70, 96 -120"/>

    <path transform="translate(60 760) scale(0.6)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="{{accent}}"/><path transform="translate(318 70) scale(0.6)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="{{accent}}"/>
  </svg>

  <p style="position: relative; margin: 0; font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.28em; color: {{accent}}">CELEBRATING [NUMBER] YEARS</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: Cinzel, serif; font-size: 40px; font-weight: 500; letter-spacing: 0.04em">The Happy Couple</span>
    <span style="margin-top: 10px; font-size: 22px; font-style: italic">a lifetime of love</span>
  </h1>

  <div style="position: relative; margin-top: 28px; width: 200px; height: 200px; border-radius: 50%; border: 1.5px solid {{accent}}; padding: 8px; box-sizing: border-box">
    <div style="width: 100%; height: 100%; border-radius: 50%; background: #2B4A42; display: flex; align-items: center; justify-content: center; font-size: 16px; font-style: italic; color: #D9D2C0">Couple's photo</div>
  </div>

  <p style="position: relative; margin: 20px 0 0; font-size: 20px; font-style: italic">Join us as we raise a glass to [Number] years together.</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 17px">[Venue name], [City]</span>
  </div>
  <a href="#" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; background: {{accent}}; color: #1F3A33; font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em">RSVP BY [DATE]</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4AF62","options":["#D4AF62", "#C9D3E6", "#C08A5B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#D4AF62' }; }
}
</script></template>

</body>
</html>
