<!doctype html>
<html lang="en">
<head>

</head>
<body>
<template id="dc-root"><x-dc>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #14213D; color: #FFFFFF; font-family: Nunito, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 64px 28px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <g fill="#FFFFFF"><circle cx="30" cy="40" r="1.5"/><circle cx="90" cy="110" r="1"/><circle cx="350" cy="60" r="1.5"/><circle cx="300" cy="200" r="1"/><circle cx="20" cy="320" r="1.5"/><circle cx="370" cy="380" r="1"/><circle cx="60" cy="520" r="1"/><circle cx="340" cy="560" r="1.5"/><circle cx="200" cy="30" r="1"/><circle cx="150" cy="790" r="1.5"/></g>
    <path transform="translate(330 120) scale(0.6)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/><path transform="translate(40 430) scale(0.5)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/>
    <g transform="translate(46 210)"><circle r="26" fill="#7B6CF6"/><ellipse rx="44" ry="10" fill="none" stroke="#C7C0FF" stroke-width="4" transform="rotate(-18)"/><circle cx="-8" cy="-6" r="5" fill="#9A8DFF"/></g>
    <circle cx="340" cy="270" r="14" fill="#C9D2E3"/><circle cx="336" cy="266" r="3" fill="#A9B4C9"/>
    <ellipse cx="195" cy="440" rx="168" ry="44" fill="none" stroke="#3A4C78" stroke-width="1.5" stroke-dasharray="4 6"/>
    <g transform="translate(316 690) rotate(30)">
      <path d="M0 -60 C 18 -40, 20 0, 14 40 L -14 40 C -20 0, -18 -40, 0 -60 Z" fill="#FFFFFF"/>
      <circle cy="-14" r="9" fill="#5FD3F3" stroke="#1F2E52" stroke-width="3"/>
      <path d="M-14 20 L-28 46 L-14 40 Z" fill="{{accent}}"/><path d="M14 20 L28 46 L14 40 Z" fill="{{accent}}"/>
      <path d="M-10 42 Q 0 80 10 42 Z" fill="#FFB23F"/><path d="M-5 42 Q 0 64 5 42 Z" fill="#FFE29A"/>
    </g>
  </svg>

  <p style="position: relative; margin: 0; font-family: Orbitron, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.24em; color: {{accent}}">3 · 2 · 1 · BLAST OFF</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: Orbitron, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.04em">BIRTHDAY STAR</span>
    <span style="margin-top: 10px; font-size: 20px; font-weight: 700">is turning 7</span>
  </h1>

  <div style="position: relative; margin-top: 30px; width: 190px; height: 190px; border-radius: 50%; border: 5px solid {{accent}}; box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.08); background: #22325A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #C9D2E3">Astronaut's photo</div>

  <p style="position: relative; margin: 20px 0 0; font-size: 18px; font-weight: 600">Suit up for an out-of-this-world birthday mission!</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; padding: 12px 18px; border-radius: 14px; border: 1.5px solid #3A4C78; background: rgba(255, 255, 255, 0.05)">
    <span style="font-size: 15px; font-weight: 600">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px">[Venue name], [City]</span>
  </div>
  <a href="#" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; background: {{accent}}; color: #14213D; font-size: 16px; font-weight: 800">RSVP by [Date]</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB23F","options":["#FFB23F", "#5FD3F3", "#FF6B6B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#FFB23F' }; }
}
</script></template>

</body>
</html>
