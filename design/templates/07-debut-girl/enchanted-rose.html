<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enchanted Rose invitation</title>
<script src="../../runtime/dc-lite.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<template id="dc-root"><x-dc>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FBF1EF; color: #5C1E2E; font-family: 'Cormorant Garamond', serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 86px 34px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <rect x="18" y="18" width="354" height="808" fill="none" stroke="#C9A35C" stroke-width="1"/>
    <rect x="24" y="24" width="342" height="796" fill="none" stroke="#C9A35C" stroke-width="0.6"/>
    <g id="rose">
      <g fill="#7FA07A"><ellipse cx="30" cy="70" rx="22" ry="8" transform="rotate(30 30 70)"/><ellipse cx="74" cy="30" rx="22" ry="8" transform="rotate(-40 74 30)"/></g>
      <circle cx="44" cy="44" r="24" fill="{{accent}}"/>
      <g fill="none" stroke="#FBF1EF" stroke-width="2" opacity="0.7"><path d="M44 30 a14 14 0 1 1 -12 8"/><path d="M44 38 a7 7 0 1 1 -6 4"/></g>
      <circle cx="82" cy="70" r="14" fill="#C77D8E"/><path d="M82 62 a7 7 0 1 1 -6 4" fill="none" stroke="#FBF1EF" stroke-width="1.5" opacity="0.7"/>
    </g>
    <use href="#rose" transform="translate(390 844) rotate(180)"/>
  </svg>

  <p style="position: relative; margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.3em">EIGHTEEN ROSES FOR</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: 'Pinyon Script', cursive; font-size: 62px; color: {{accent}}; line-height: 1.1">The Celebrant</span>
    <span style="margin-top: 6px; font-size: 24px; font-style: italic">at eighteen</span>
  </h1>

  <div style="position: relative; margin-top: 24px; width: 200px; height: 260px; border-radius: 50%; border: 1.5px solid #C9A35C; padding: 8px; box-sizing: border-box">
    <div style="width: 100%; height: 100%; border-radius: 50%; background: #F3DDDB; display: flex; align-items: center; justify-content: center; font-size: 16px; font-style: italic; color: #7A2E3E">Debutante's photo</div>
  </div>

  <p style="position: relative; margin: 20px 0 0; font-size: 20px; font-style: italic">Join us for an evening of roses, candles and a grand debut.</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 17px">[Venue name], [City]</span>
  </div>
  <a href="#" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; letter-spacing: 0.14em">RSVP BY [DATE]</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9E2A3F","options":["#9E2A3F", "#C77D8E", "#B8892E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#9E2A3F' }; }
}
</script></template>

</body>
</html>
