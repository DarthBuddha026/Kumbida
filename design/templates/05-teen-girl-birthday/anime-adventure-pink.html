<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Adventure invitation</title>
<script src="../../runtime/dc-lite.js"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Dela+Gothic+One&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<template id="dc-root"><x-dc>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; color: #1B1B2F; font-family: 'M PLUS Rounded 1c', sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 40px 24px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <g stroke="#1B1B2F" stroke-width="1.5" opacity="0.12">
      <line x1="195" y1="330" x2="-40" y2="0"/><line x1="195" y1="330" x2="40" y2="-20"/><line x1="195" y1="330" x2="120" y2="-20"/><line x1="195" y1="330" x2="270" y2="-20"/><line x1="195" y1="330" x2="350" y2="-20"/><line x1="195" y1="330" x2="430" y2="0"/><line x1="195" y1="330" x2="430" y2="160"/><line x1="195" y1="330" x2="430" y2="330"/><line x1="195" y1="330" x2="-40" y2="160"/><line x1="195" y1="330" x2="-40" y2="330"/>
    </g>
    <g fill="{{sky}}" opacity="0.9">
      <path transform="translate(40 230) rotate(20)" d="M0 -12 C 6 -12, 10 -4, 0 8 C -10 -4, -6 -12, 0 -12 Z"/>
      <path transform="translate(340 190) rotate(-30) scale(0.8)" d="M0 -12 C 6 -12, 10 -4, 0 8 C -10 -4, -6 -12, 0 -12 Z"/>
      <path transform="translate(320 520) rotate(60)" d="M0 -12 C 6 -12, 10 -4, 0 8 C -10 -4, -6 -12, 0 -12 Z"/>
      <path transform="translate(50 600) rotate(-10) scale(0.7)" d="M0 -12 C 6 -12, 10 -4, 0 8 C -10 -4, -6 -12, 0 -12 Z"/>
      <path transform="translate(80 120) rotate(40) scale(0.6)" d="M0 -12 C 6 -12, 10 -4, 0 8 C -10 -4, -6 -12, 0 -12 Z"/>
    </g>
  </svg>

  <p style="position: relative; margin: 0; padding: 6px 12px; background: #1B1B2F; color: #FFFFFF; font-size: 12px; font-weight: 800; letter-spacing: 0.2em; transform: skewX(-10deg)">EPISODE 14 · A NEW LEVEL</p>
  <h1 style="position: relative; margin: 14px 0 0; display: flex; flex-direction: column; line-height: 1">
    <span style="font-family: 'Dela Gothic One', sans-serif; font-size: 44px; font-weight: 400; color: {{sky}}; -webkit-text-stroke: 2px #1B1B2F">BIRTHDAY<br>STAR</span>
    <span style="margin-top: 6px; font-size: 24px; font-weight: 800">turns fourteen!</span>
  </h1>

  <div style="position: relative; margin-top: 22px; width: 100%; height: 250px; display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px">
    <div style="grid-row: 1 / -1; border: 3px solid #1B1B2F; background: #FDE7EE; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #7A3550; clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%)">Celebrant's photo</div>
    <div style="border: 3px solid #1B1B2F; background: {{sky}}; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 30px; color: #FFFFFF; -webkit-text-stroke: 1px #1B1B2F">14!</div>
    <div style="position: relative; border: 3px solid #1B1B2F; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 8px; font-size: 13px; font-weight: 700; line-height: 1.3">"Join my quest for cake and games!"</div>
  </div>

  <div style="position: relative; margin-top: 22px; width: 100%; border: 3px solid #1B1B2F; background: #FFFFFF; box-shadow: 5px 5px 0 #1B1B2F; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.18em; color: #5A5A70">NEXT EPISODE AIRS</span>
    <span style="font-size: 19px; font-weight: 800">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px; font-weight: 500">[Venue name], [City]</span>
  </div>
  <a href="#" style="position: relative; margin-top: 18px; min-height: 52px; display: inline-flex; align-items: center; padding: 0 30px; border: 3px solid #1B1B2F; background: {{sky}}; color: #1B1B2F; font-size: 17px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #1B1B2F">RSVP by [Date]</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sky":{"editor":"color","default":"#FF7AA2","options":["#FF7AA2","#5BC0EB","#FFB443"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { sky: this.props.sky ?? '#FF7AA2' }; }
}
</script></template>

</body>
</html>
