<head>

    <rect width="390" height="844" fill="url(#chk)" opacity="0.16"/>
    <path transform="translate(330 60)" d="M0 -18 L5 -5 L19 -5 L8 4 L12 18 L0 10 L-12 18 L-8 4 L-19 -5 L-5 -5 Z" fill="#F6D366" stroke="#3A3355" stroke-width="2"/>

  </svg>

  <p style="position: relative; margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.24em">SAVE THE DATE, BESTIE</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: 'Permanent Marker', cursive; font-size: 48px; color: #3A3355">Birthday Star</span>
    <span style="margin-top: 8px; font-size: 20px; font-weight: 700">turns 15</span>
  </h1>

  <div style="position: relative; margin-top: 26px; width: 240px; height: 260px">
    <div style="position: absolute; left: 34px; top: 4px; width: 180px; height: 220px; background: #FFFFFF; transform: rotate(8deg); box-shadow: 0 8px 18px rgba(58, 51, 85, 0.15)"></div>
    <div style="position: absolute; left: 20px; top: 14px; width: 190px; height: 230px; box-sizing: border-box; padding: 10px 10px 42px; background: #FFFFFF; transform: rotate(-4deg); box-shadow: 0 10px 22px rgba(58, 51, 85, 0.18)">
      <div style="width: 100%; height: 100%; background: #ECE6F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #5A4E85">Celebrant's photo</div>
      <span style="position: absolute; left: 0; right: 0; bottom: 10px; font-family: 'Permanent Marker', cursive; font-size: 16px; color: #3A3355">fifteen!</span>
    </div>
    <span style="position: absolute; left: 92px; top: 0; width: 64px; height: 22px; background: {{accent}}; opacity: 0.8; transform: rotate(-6deg)"></span>
  </div>

  <p style="position: relative; margin: 20px 0 0; font-size: 17px; font-weight: 500">Snacks, selfies and good vibes only. Don’t miss it!</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 15px; font-weight: 600">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px">[Venue name], [City]</span>
  </div>
  <a href="#" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; background: #3A3355; color: #FFFFFF; font-size: 16px; font-weight: 700">RSVP by [Date]</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B9A3F0","options":["#B9A3F0", "#F5B3C8", "#A9DCC6"]},"$preview":{"width":390,"height":844}}'>

  renderVals() { return { accent: this.props.accent ?? '#B9A3F0' }; }
}
</script></template>
