<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Glam invitation</title>
<script src="../../runtime/dc-lite.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<template id="dc-root"><x-dc>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFE3EF; color: #5A1037; font-family: Poppins, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 46px 28px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <circle cx="390" cy="0" r="150" fill="{{pink}}" opacity="0.18"/>
    <circle cx="0" cy="844" r="180" fill="{{pink}}" opacity="0.18"/>
    <g fill="{{pink}}">
      <path transform="translate(40 120) scale(0.9)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
      <path transform="translate(330 250) scale(0.7)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
      <path transform="translate(320 650) scale(1.1)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
      <path transform="translate(30 520) scale(0.6)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
    </g>
    <g fill="#FFFFFF"><circle cx="70" cy="80" r="3"/><circle cx="350" cy="140" r="2.5"/><circle cx="60" cy="400" r="2"/><circle cx="345" cy="470" r="3"/></g>
    <path transform="translate(296 40)" d="M20 36 C 0 22, 0 4, 10 4 C 16 4, 20 10, 20 12 C 20 10, 24 4, 30 4 C 40 4, 40 22, 20 36 Z" fill="#FFFFFF" stroke="{{pink}}" stroke-width="2.5"/>
    <path transform="translate(40 700) scale(0.8)" d="M20 36 C 0 22, 0 4, 10 4 C 16 4, 20 10, 20 12 C 20 10, 24 4, 30 4 C 40 4, 40 22, 20 36 Z" fill="{{pink}}"/>
  </svg>

  <p style="position: relative; margin: 0; padding: 6px 14px; border-radius: 999px; background: #5A1037; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: 0.24em">IT'S A GLAM PARTY</p>
  <h1 style="position: relative; margin: 14px 0 0; display: flex; flex-direction: column; line-height: 0.95; font-weight: 400">
    <span style="font-family: 'Abril Fatface', serif; font-size: 44px; color: {{pink}}">Birthday Star</span>
    <span style="margin-top: 8px; font-size: 22px; font-weight: 700; letter-spacing: 0.06em">is turning <span style="font-family: 'Abril Fatface', serif; font-size: 40px; font-weight: 400; color: {{pink}}">10</span></span>
  </h1>

  <div style="position: relative; margin-top: 22px; width: 220px; height: 260px; border-radius: 22px; background: #FFFFFF; padding: 10px 10px 34px; box-sizing: border-box; transform: rotate(-3deg); box-shadow: 0 14px 30px rgba(90, 16, 55, 0.18)">
    <div style="width: 100%; height: 100%; border-radius: 14px; background: #FFC7DD; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #8A1B53">Celebrant's photo</div>
    <span style="position: absolute; left: 0; right: 0; bottom: 8px; font-family: 'Abril Fatface', serif; font-size: 15px; color: #5A1037">#BirthdayStarTurns10</span>
  </div>

  <p style="position: relative; margin: 22px 0 0; font-size: 16px; font-weight: 500">Dress up in your sparkliest pink and strike a pose with us!</p>
  <div style="position: relative; margin-top: 14px; display: flex; gap: 10px">
    <span style="padding: 10px 14px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">DATE</span><span style="font-size: 15px; font-weight: 700">[Month Day, Year]</span></span>
    <span style="padding: 10px 14px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">TIME</span><span style="font-size: 15px; font-weight: 700">[Time]</span></span>
  </div>
  <p style="position: relative; margin: 10px 0 0; font-size: 15px; font-weight: 600">[Venue name], [City]</p>
  <a href="#" style="position: relative; margin-top: 16px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; border-radius: 999px; background: {{pink}}; color: #FFFFFF; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-decoration: none">RSVP by [Date]</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pink":{"editor":"color","default":"#D6247A","options":["#D6247A","#A23CC0","#E0457B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { pink: this.props.pink ?? '#D6247A' }; }
}
</script></template>

</body>
</html>
