<body>
<template id="dc-root"><x-dc>

<div style="background: #F5F2E9; color: #294B49; font-family: Nunito, sans-serif; line-height: 1.5; overflow-x: hidden">

  <!-- NAV -->
  <header style="border-bottom: 1px solid #DCE3DD; background: #F5F2E9">
    <nav aria-label="Main" style="max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #294B49">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C5A66B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </span>
        <span style="font-family: Fraunces, serif; font-size: 22px; font-weight: 600">Kumbida</span>
      </a>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; font-size: 15px; font-weight: 700">
        <a href="#how" style="color: #294B49; text-decoration: none">How it works</a>
        <a href="#designs" style="color: #294B49; text-decoration: none">Designs</a>
        <a href="#packages" style="color: #294B49; text-decoration: none">Packages</a>
        <a href="#faq" style="color: #294B49; text-decoration: none">FAQ</a>
        <a href="#contact" style="color: #294B49; text-decoration: none">Contact</a>
        <a href="Booking.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 22px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 800">Book now</a>
      </div>
    </nav>
  </header>

  <!-- HERO -->
  <section style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px">
    <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
      <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.16em; color: #356B68">WEDDINGS · BIRTHDAYS · BAPTISMS · ANNIVERSARIES</p>
      <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 60px; line-height: 1.04; letter-spacing: -0.01em; text-wrap: balance">Beautiful invitations. RSVPs that count themselves.</h1>
      <p style="margin: 0; font-size: 19px; color: #5A6B67; max-width: 34em">Your celebration gets its own invitation page. Share one link in Messenger, Viber or on a printed QR code, and watch your guest count update as people reply. No app for your guests, no spreadsheets for you.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a href="Booking.html" style="min-height: 54px; display: inline-flex; align-items: center; padding: 0 30px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-weight: 800; font-size: 16px; text-decoration: none">Book now · from ₱299</a>
        <a href="#sample" style="min-height: 54px; display: inline-flex; align-items: center; padding: 0 28px; border-radius: 999px; border: 1.5px solid #B7C4BB; color: #294B49; font-weight: 800; font-size: 16px; text-decoration: none">View a sample invitation</a>
      </div>
      <p style="margin: 0; font-size: 14px; color: #5A6B67">Pay with GCash or Maya · Live in as little as [X] days</p>
    </div>

    <div id="sample" style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center">
      <div style="position: relative; width: 300px">
        <div style="width: 300px; height: 600px; border-radius: 40px; border: 9px solid #2E2226; background: #FFF7F2; box-shadow: 0 30px 60px rgba(59, 42, 47, 0.22); overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 30px 18px; text-align: center; color: #4A2E35">
          <span style="font-size: 10px; font-weight: 800; letter-spacing: 0.2em; color: #B5475C">YOU'RE INVITED TO</span>
          <span style="font-family: Fraunces, serif; font-style: italic; font-size: 44px; line-height: 1">Lia's</span>
          <span style="font-family: Fraunces, serif; font-size: 22px; line-height: 1">First Birthday</span>
          <div style="position: relative; width: 180px; height: 220px; margin-top: 6px">
            <div style="width: 180px; height: 220px; border-radius: 90px 90px 20px 20px; background: #F6D3D9; border: 5px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #7A4B56">Baby's photo</div>
            <div style="position: absolute; right: -10px; bottom: -10px; width: 64px; height: 64px; border-radius: 50%; background: #B5475C; border: 4px solid #FFF7F2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Fraunces, serif; font-size: 30px; font-weight: 600">1</div>
          </div>
          <span style="margin-top: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.12em">SAT · JANUARY 23, 2027 · 3 PM</span>
          <span style="min-height: 40px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 999px; background: #B5475C; color: #FFFFFF; font-size: 13px; font-weight: 800">RSVP by January 9</span>
        </div>
        <div style="position: absolute; left: -120px; bottom: 70px; width: 210px; background: #FFFFFF; border: 1px solid #DCE3DD; border-radius: 18px; box-shadow: 0 16px 34px rgba(41, 75, 73, 0.16); padding: 16px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #5A6B67">YOUR RESPONSES · SAMPLE</span>
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: Fraunces, serif; font-size: 34px; font-weight: 600; line-height: 1">85</span><span style="font-size: 13px; font-weight: 700; color: #5A6B67">attending</span></div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 800">
            <span style="padding: 4px 10px; border-radius: 999px; background: #D7E0D9; color: #356B68">12 kids</span>
            <span style="padding: 4px 10px; border-radius: 999px; background: #EDF1EC; color: #34504D">9 declined</span>
          </div>
        </div>
        <div style="position: absolute; right: -96px; top: 90px; width: 168px; background: #FFFFFF; border: 1px solid #DCE3DD; border-radius: 18px; box-shadow: 0 16px 34px rgba(41, 75, 73, 0.16); padding: 14px; display: flex; gap: 10px; align-items: center">
          <span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #D7E0D9; color: #356B68; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          </span>
          <span style="font-size: 13px; font-weight: 700; line-height: 1.3">Tita Grace replied: <strong>3 coming</strong></span>
        </div>
      </div>
    </div>
  </section>

  <!-- OCCASIONS -->
  <section aria-label="Occasions" style="border-top: 1px solid #DCE3DD; border-bottom: 1px solid #DCE3DD; background: #FFFFFF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 22px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 28px; font-family: Fraunces, serif; font-size: 22px; color: #5A6B67">
      <span>Weddings</span><span aria-hidden="true" style="color: #B7C4BB">✦</span>
      <span>Debuts</span><span aria-hidden="true" style="color: #B7C4BB">✦</span>
      <span>Birthdays</span><span aria-hidden="true" style="color: #B7C4BB">✦</span>
      <span>Baptisms</span><span aria-hidden="true" style="color: #B7C4BB">✦</span>
      <span>Anniversaries</span>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section id="how" style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 10px; max-width: 640px">
      <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.16em; color: #356B68">HOW IT WORKS</p>
      <h2 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 42px; line-height: 1.1; text-wrap: balance">From "we're celebrating" to a full guest count in four steps</h2>
    </div>
    <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px">
      <li style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: Fraunces, serif; font-size: 40px; font-weight: 500; color: {{accent}}; line-height: 1">1</span>
        <h3 style="margin: 0; font-size: 19px; font-weight: 800">Pick a package and design</h3>
        <p style="margin: 0; font-size: 16px; color: #5A6B67">Choose the tier that fits your event and a template from our library.</p>
      </li>
      <li style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: Fraunces, serif; font-size: 40px; font-weight: 500; color: {{accent}}; line-height: 1">2</span>
        <h3 style="margin: 0; font-size: 19px; font-weight: 800">Add your details and photos</h3>
        <p style="margin: 0; font-size: 16px; color: #5A6B67">Fill them in yourself on your private link, or send them to us and we set it up (Lite and up).</p>
      </li>
      <li style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: Fraunces, serif; font-size: 40px; font-weight: 500; color: {{accent}}; line-height: 1">3</span>
        <h3 style="margin: 0; font-size: 19px; font-weight: 800">Share one link</h3>
        <p style="margin: 0; font-size: 16px; color: #5A6B67">Post it in your group chats or print the QR code. It shows a designed preview card in Messenger and Facebook.</p>
      </li>
      <li style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: Fraunces, serif; font-size: 40px; font-weight: 500; color: {{accent}}; line-height: 1">4</span>
        <h3 style="margin: 0; font-size: 19px; font-weight: 800">Watch the replies come in</h3>
        <p style="margin: 0; font-size: 16px; color: #5A6B67">See who's coming, how many kids, and their messages, all on your private link.</p>
      </li>
    </ol>
  </section>

  <!-- DESIGNS -->
  <section id="designs" style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 10px; max-width: 640px">
        <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.16em; color: #356B68">OUR DESIGNS</p>
        <h2 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 42px; line-height: 1.1; text-wrap: balance">A design for every celebration</h2>
        <p style="margin: 0; font-size: 17px; color: #5A6B67">{{designCount}} designs, from princess castles and race tracks to quiet, elegant weddings. Each one has the same RSVP form and works on any phone.</p>
      </div>
      <a href="Booking.html" style="font-weight: 800; font-size: 16px">Book with a design</a>
    </div>
    <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px 20px">
      <template data-sc="for" list="{{designs}}" as="d" hint-placeholder-count="15">
        <li>
          <button type="button" onClick="{{d.open}}" aria-label="Preview the {{d.name}} design" style="width: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; text-align: left; font-family: Nunito, sans-serif; display: flex; flex-direction: column; gap: 10px; color: #294B49">
          <span aria-hidden="true" style="{{d.cv.box}}">
            <span style="{{d.cv.small}}">{{d.small}}</span>
            <span style="{{d.cv.title}}">{{d.sample}}</span>
          </span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 2px">
              <span style="font-size: 16px; font-weight: 800">{{d.name}}</span>
              <span style="font-size: 13px; color: #5A6B67">{{d.tags}}</span>
            </span>
          </button>
        </li>
      </template>
    </ul>
    <div style="padding: 20px 24px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid #DCE3DD; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">Want something one of a kind?</span><span style="font-size: 15px; color: #5A6B67">With Personalized (₱4,999), we design a page just for your event, with 2 rounds of revisions.</span></span>
      <a href="Booking.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 999px; border: 2px solid #C9D4CC; background: #FFFFFF; color: #356B68; font-weight: 800; text-decoration: none">Book Personalized</a>
    </div>
  </section>

  <!-- FEATURES -->
  <section style="background: #FFFFFF; border-top: 1px solid #DCE3DD; border-bottom: 1px solid #DCE3DD">
    <div style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px">
      <div style="display: flex; flex-direction: column; gap: 10px; max-width: 640px">
        <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.16em; color: #356B68">WHAT YOU GET</p>
        <h2 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 42px; line-height: 1.1; text-wrap: balance">Made for how invitations actually get sent</h2>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px 40px">
        <div style="display: flex; gap: 16px">
          <span aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 14px; background: #D7E0D9; color: #356B68; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg></span>
          <div style="display: flex; flex-direction: column; gap: 4px"><h3 style="margin: 0; font-size: 18px; font-weight: 800">Looks great on any phone</h3><p style="margin: 0; color: #5A6B67">Fast on mobile data and inside Messenger's browser. Guests don't download anything.</p></div>
        </div>
        <div style="display: flex; gap: 16px">
          <span aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 14px; background: #D7E0D9; color: #356B68; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span>
          <div style="display: flex; flex-direction: column; gap: 4px"><h3 style="margin: 0; font-size: 18px; font-weight: 800">RSVPs that add up for you</h3><p style="margin: 0; color: #5A6B67">Headcount, kids and messages, totaled live. Download the list for your caterer (Lite and up).</p></div>
        </div>
        <div style="display: flex; gap: 16px">
          <span aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 14px; background: #D7E0D9; color: #356B68; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></span>
          <div style="display: flex; flex-direction: column; gap: 4px"><h3 style="margin: 0; font-size: 18px; font-weight: 800">Guest list with reserved seats</h3><p style="margin: 0; color: #5A6B67">"We've reserved 3 seats for you." Guests find their invitation by name; you see who's still pending (Premium).</p></div>
        </div>
        <div style="display: flex; gap: 16px">
          <span aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 14px; background: #D7E0D9; color: #356B68; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
          <div style="display: flex; flex-direction: column; gap: 4px"><h3 style="margin: 0; font-size: 18px; font-weight: 800">Change details anytime</h3><p style="margin: 0; color: #5A6B67">Venue moved? Time changed? Update it on your private link and the page updates for everyone.</p></div>
        </div>
        <div style="display: flex; gap: 16px">
          <span aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 14px; background: #D7E0D9; color: #356B68; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg></span>
          <div style="display: flex; flex-direction: column; gap: 4px"><h3 style="margin: 0; font-size: 18px; font-weight: 800">QR code for printed invites</h3><p style="margin: 0; color: #5A6B67">Add it to your printed cards or venue signage so older relatives can reply too.</p></div>
