<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumbida admin dashboard</title>
<script src="../runtime/dc-lite.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@1,600&amp;family=Cormorant:wght@500&amp;family=Playfair+Display:wght@500;800&amp;family=Abril+Fatface&amp;family=Racing+Sans+One&amp;family=Lilita+One&amp;family=Dela+Gothic+One&amp;family=Bangers&amp;family=Caveat:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F2E9}
a{color:#356B68}a:hover{color:#294B49}
input,select{font-family:Nunito,sans-serif}
input::placeholder{color:#7E8C88}
</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&amp;family=Quicksand:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&amp;family=Barlow:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Dela+Gothic+One&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Montserrat:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<template id="dc-root"><x-dc>

<div style="min-height: 1200px; display: flex; flex-wrap: wrap; background: #F5F2E9; color: #294B49; font-family: Nunito, sans-serif; line-height: 1.45">

  <!-- SIDEBAR -->
  <nav aria-label="Admin" style="flex: 1 1 240px; max-width: 100%; background: #294B49; color: #FFFFFF; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 9px; background: #C5A66B; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#294B49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </span>
      <span style="font-family: Fraunces, serif; font-size: 20px; font-weight: 600">Kumbida</span>
      <span style="margin-left: auto; padding: 2px 8px; border-radius: 999px; background: #356B68; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #C5A66B">ADMIN</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <template data-sc="for" list="{{nav}}" as="n" hint-placeholder-count="6">
        <button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" style="{{n.style}}">
          <span>{{n.label}}</span>
          <template data-sc="if" value="{{n.hasCount}}" hint-placeholder-val="{{ false }}">
            <span style="{{n.countStyle}}">{{n.count}}</span>
          </template>
        </button>
      </template>
    </div>
    <div style="margin-top: auto; padding: 12px; border-radius: 12px; background: #1E3836; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #C5A66B; color: #1E3836; font-weight: 800; display: flex; align-items: center; justify-content: center">O</span>
      <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 800">[Owner name]</span><span style="font-size: 12px; color: #B7C4BB">Owner</span></span>
      <button type="button" style="margin-left: auto; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #5A6B67; background: transparent; color: #D7E0D9; font-family: Nunito, sans-serif; font-size: 12px; font-weight: 800; cursor: pointer">Log out</button>
    </div>
  </nav>

  <!-- MAIN -->
  <main style="flex: 999 1 640px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 700; color: #5A6B67">Wednesday, November 18, 2026 · sample data</span>
        <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 34px; line-height: 1.1">{{title}}</h1>
      </div>
      <button type="button" style="min-height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New event
      </button>
    </div>

    <!-- ================= OVERVIEW ================= -->
    <template data-sc="if" value="{{vOverview}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 22px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
          <button type="button" onClick="{{goPayments}}" style="text-align: left; cursor: pointer; background: #FFFFFF; border: 1.5px solid {{payTileBorder}}; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px; font-family: Nunito, sans-serif; color: #294B49">
            <span style="font-size: 13px; font-weight: 800; color: #5A6B67">Payments to verify</span>
            <span style="font-size: 34px; font-weight: 800; line-height: 1.1">{{pendingReceipts}}</span>
            <span style="font-size: 13px; color: #5A6B67">receipts in {{pendingOrders}} orders · {{flaggedCount}} flagged</span>
          </button>
          <button type="button" onClick="{{goSetup}}" style="text-align: left; cursor: pointer; background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px; font-family: Nunito, sans-serif; color: #294B49">
            <span style="font-size: 13px; font-weight: 800; color: #5A6B67">Setup queue</span>
            <span style="font-size: 34px; font-weight: 800; line-height: 1.1">{{setupCount}}</span>
            <span style="font-size: 13px; color: #5A6B67">paid events waiting for you</span>
          </button>
          <div style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; font-weight: 800; color: #5A6B67">Live events</span>
            <span style="font-size: 34px; font-weight: 800; line-height: 1.1">2</span>
            <span style="font-size: 13px; color: #5A6B67">127 guests confirmed so far</span>
          </div>
          <div style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; font-weight: 800; color: #5A6B67">Confirmed in November</span>
            <span style="font-size: 34px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums">₱{{monthTotal}}</span>
            <span style="font-size: 13px; color: #5A6B67">from {{monthOrders}} orders</span>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 18px">
          <section aria-labelledby="todo-h" style="flex: 1 1 380px; background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
            <h2 id="todo-h" style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 22px">Needs you today</h2>
            <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
              <li style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #FFF8EE"><span aria-hidden="true" style="flex: none; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: #C77A16"></span><span><strong>Santos 50th Anniversary:</strong> receipt flagged "Same image uploaded before". Check it in Payments.</span></li>
              <li style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #EDF1EC"><span aria-hidden="true" style="flex: none; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: {{accent}}"></span><span><strong>Lia's First Birthday:</strong> 2 receipts (₱450 + ₱49) waiting to be confirmed.</span></li>
              <li style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #EDF1EC"><span aria-hidden="true" style="flex: none; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: #5A6B67"></span><span><strong>Reyes Golden Wedding:</strong> paid, set up within 2 days (Lite).</span></li>
              <li style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #EDF1EC"><span aria-hidden="true" style="flex: none; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: #5A6B67"></span><span><strong>Mika's Debut</strong> (Personalized): revision round 1 of 2 requested.</span></li>
            </ul>
          </section>
          <section aria-labelledby="up-h" style="flex: 1 1 380px; background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
            <h2 id="up-h" style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 22px">Coming up</h2>
            <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
              <li style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E6ECE7"><span><strong>Baby Gabriel's Christening</strong><br><span style="font-size: 13px; color: #5A6B67">Dec 12 · RSVP closes Dec 1</span></span><span style="font-size: 14px; font-weight: 800; white-space: nowrap">42 attending</span></li>
              <li style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E6ECE7"><span><strong>Lia's First Birthday</strong><br><span style="font-size: 13px; color: #5A6B67">Jan 23 · not live yet (payment check)</span></span><span style="font-size: 14px; font-weight: 800; white-space: nowrap">—</span></li>
              <li style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0"><span><strong>Ana &amp; Marco</strong><br><span style="font-size: 13px; color: #5A6B67">Feb 14 · guest list · 35 pending</span></span><span style="font-size: 14px; font-weight: 800; white-space: nowrap">85 / 120 seats</span></li>
            </ul>
          </section>
        </div>
      </div>
    </template>

    <!-- ================= EVENTS ================= -->
    <template data-sc="if" value="{{vEvents}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
          <label for="ev-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search events</label>
          <input id="ev-q" type="search" placeholder="Search by event or host" value="{{q}}" onChange="{{onQ}}" style="flex: 1 1 260px; min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 15px; color: #294B49; box-sizing: border-box">
          <div role="group" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 6px">
            <template data-sc="for" list="{{filters}}" as="f" hint-placeholder-count="5">
              <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
            </template>
          </div>
        </div>
        <div style="overflow-x: auto; background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 18px">
          <table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px">
            <thead>
              <tr style="text-align: left; color: #5A6B67; font-size: 12px; letter-spacing: 0.08em">
                <th scope="col" style="padding: 14px 16px; border-bottom: 1px solid #DCE3DD">EVENT</th>
                <th scope="col" style="padding: 14px 16px; border-bottom: 1px solid #DCE3DD">PACKAGE</th>
                <th scope="col" style="padding: 14px 16px; border-bottom: 1px solid #DCE3DD">DATE</th>
                <th scope="col" style="padding: 14px 16px; border-bottom: 1px solid #DCE3DD">STATUS</th>
                <th scope="col" style="padding: 14px 16px; border-bottom: 1px solid #DCE3DD">REPLIES</th>
                <th scope="col" style="padding: 14px 16px; border-bottom: 1px solid #DCE3DD"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
              </tr>
            </thead>
            <tbody>
              <template data-sc="for" list="{{events}}" as="e" hint-placeholder-count="5">
                <tr>
                  <td style="padding: 14px 16px; border-bottom: 1px solid #E6ECE7"><span style="display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 15px">{{e.name}}</span><span style="font-size: 13px; color: #5A6B67">{{e.type}} · host {{e.host}}</span></span></td>
                  <td style="padding: 14px 16px; border-bottom: 1px solid #E6ECE7"><span style="display: flex; flex-direction: column"><span style="font-weight: 700">{{e.pkg}}</span><span style="font-size: 13px; color: #5A6B67">{{e.mode}}</span></span></td>
                  <td style="padding: 14px 16px; border-bottom: 1px solid #E6ECE7; white-space: nowrap">{{e.date}}</td>
                  <td style="padding: 14px 16px; border-bottom: 1px solid #E6ECE7"><span style="{{e.pillStyle}}">{{e.status}}</span></td>
                  <td style="padding: 14px 16px; border-bottom: 1px solid #E6ECE7; font-weight: 700; white-space: nowrap">{{e.replies}}</td>
                  <td style="padding: 14px 16px; border-bottom: 1px solid #E6ECE7; text-align: right; white-space: nowrap">
                    <button type="button" style="min-height: 38px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #DCE3DD; background: #FFFFFF; color: #356B68; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">Copy host link</button>
                    <button type="button" style="min-height: 38px; padding: 0 12px; border-radius: 10px; border: 0; background: #294B49; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">Open</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <template data-sc="if" value="{{noEvents}}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; padding: 24px; text-align: center; color: #5A6B67">No events match. Try another search or filter.</p>
          </template>
        </div>
      </div>
    </template>

    <!-- ================= PAYMENTS ================= -->
    <template data-sc="if" value="{{vPayments}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <p style="margin: 0; color: #5A6B67; max-width: 60em">Find each reference in your UnionBank history (it's the number at the end of "Received from …"), check the amount and date, then confirm. Flags are hints to look closer, not proof.</p>
        <template data-sc="if" value="{{noPayments}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 40px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid #DCE3DD; text-align: center; display: flex; flex-direction: column; gap: 6px">
            <span style="font-family: Fraunces, serif; font-size: 24px">All caught up</span>
            <span style="color: #5A6B67">No payments waiting. Confirmed orders moved to the setup queue or went live.</span>
          </div>
        </template>
        <template data-sc="for" list="{{orders}}" as="o" hint-placeholder-count="2">
          <section style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 20px; overflow: hidden">
            <header style="padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: #EDF1EC">
              <div style="display: flex; flex-direction: column">
                <span style="font-size: 16px; font-weight: 800">{{o.event}}</span>
                <span style="font-size: 13px; color: #5A6B67">Order {{o.code}} · {{o.pkg}} · paid by {{o.payer}}</span>
              </div>
              <span style="{{o.totalStyle}}">₱{{o.totalStr}} of ₱{{o.priceStr}}</span>
            </header>
            <template data-sc="for" list="{{o.receipts}}" as="r" hint-placeholder-count="1">
              <div style="padding: 16px 20px; border-top: 1px solid #E6ECE7; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
                <div aria-hidden="true" style="flex: none; width: 54px; height: 96px; border-radius: 8px; background: #E9E3F4; border: 1px solid #D3CBE6; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #5E4E7A">RECEIPT</div>
                <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
                  <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px">
                    <span style="display: flex; align-items: center; gap: 8px">
                      <span style="font-size: 12px; font-weight: 800; color: #5A6B67">REF</span>
                      <span style="font-size: 24px; font-weight: 800; letter-spacing: 0.06em; font-variant-numeric: tabular-nums">{{r.ref6}}</span>
                      <span style="font-size: 13px; color: #5A6B67">({{r.refFull}})</span>
                    </span>
                    <span style="font-size: 18px; font-weight: 800">₱{{r.amount}}</span>
                    <span style="font-size: 14px; color: #294B49">{{r.when}}</span>
                    <span style="font-size: 14px; color: #5A6B67">via {{r.app}}</span>
                  </div>
                  <template data-sc="if" value="{{r.hasFlags}}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-wrap: wrap; gap: 6px">
                      <template data-sc="for" list="{{r.flags}}" as="fl" hint-placeholder-count="1">
                        <span style="padding: 4px 10px; border-radius: 999px; background: #FFF4E5; border: 1px solid #F0D3A6; color: #7A4A0B; font-size: 13px; font-weight: 800">⚠ {{fl.label}}</span>
                      </template>
                    </div>
                  </template>
                  <template data-sc="if" value="{{r.noFlags}}" hint-placeholder-val="{{ true }}">
                    <span style="font-size: 13px; font-weight: 700; color: #2F5A47">No flags · receipt read matched what the client submitted</span>
                  </template>
                  <template data-sc="if" value="{{r.rejecting}}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border-radius: 12px; background: #D7E0D9">
                      <label for="{{r.reasonId}}" style="font-size: 13px; font-weight: 800">Reason the host will see</label>
                      <select id="{{r.reasonId}}" style="min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1.5px solid #C9D4CC; background: #FFFFFF; font-size: 14px; color: #294B49">
                        <option>Reference not found yet. Please check the number.</option>
                        <option>Amount doesn't match what we received.</option>
                        <option>This receipt was already used for another order.</option>
                        <option>Screenshot is unclear. Please upload a sharper one.</option>
                      </select>
                      <button type="button" onClick="{{r.doReject}}" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #356B68; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">Send rejection</button>
                      <button type="button" onClick="{{r.cancelReject}}" style="min-height: 40px; padding: 0 10px; border: 0; background: transparent; color: #356B68; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">Cancel</button>
                    </div>
                  </template>
                </div>
                <div style="flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 170px">
                  <template data-sc="if" value="{{r.isPending}}" hint-placeholder-val="{{ true }}">
                    <div style="display: flex; flex-direction: column; gap: 8px">
