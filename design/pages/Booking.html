<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book your invitation — Kumbida</title>
<script src="../runtime/dc-lite.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@1,600&amp;family=Cormorant:wght@500&amp;family=Playfair+Display:wght@500;800&amp;family=Abril+Fatface&amp;family=Racing+Sans+One&amp;family=Lilita+One&amp;family=Dela+Gothic+One&amp;family=Bangers&amp;family=Caveat:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F2E9}
a{color:#356B68}a:hover{color:#294B49}
input,select,textarea{font-family:Nunito,sans-serif}
input::placeholder,textarea::placeholder{color:#7E8C88}
</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&amp;family=Quicksand:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&amp;family=Barlow:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Dela+Gothic+One&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Montserrat:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<template id="dc-root"><x-dc>

<div style="min-height: 1600px; background: #F5F2E9; color: #294B49; font-family: Nunito, sans-serif; line-height: 1.5">

  <!-- NAV -->
  <header style="border-bottom: 1px solid #DCE3DD; background: #F5F2E9">
    <nav aria-label="Main" style="max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Main.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #294B49">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C5A66B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </span>
        <span style="font-family: Fraunces, serif; font-size: 22px; font-weight: 600">Kumbida</span>
      </a>
      <a href="Main.html" style="font-size: 15px; font-weight: 700; text-decoration: none">← Back to home</a>
    </nav>
  </header>

  <div style="max-width: 1200px; margin: 0 auto; padding: 44px 24px 72px; display: flex; flex-direction: column; gap: 28px">

    <!-- ===== FORM VIEW ===== -->
    <template data-sc="if" value="{{isForm}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; flex-direction: column; gap: 8px; max-width: 700px">
          <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.16em; color: #356B68">BOOK YOUR INVITATION</p>
          <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 46px; line-height: 1.08; text-wrap: balance">Tell us about your celebration</h1>
          <p style="margin: 0; font-size: 17px; color: #5A6B67">Takes about 2 minutes. No payment yet: we'll check the details and send you a private link to pay and set up your invitation.</p>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

          <!-- FORM -->
          <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px">

            <!-- 1 PACKAGE -->
            <section aria-labelledby="b1" style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
              <h2 id="b1" style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 24px">1. Choose a package</h2>
              <div role="radiogroup" aria-labelledby="b1" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px">
                <template data-sc="for" list="{{pkgs}}" as="k" hint-placeholder-count="6">
                  <button type="button" role="radio" aria-checked="{{k.on}}" onClick="{{k.pick}}" style="{{k.style}}">
                    <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%">
                      <span style="font-family: Fraunces, serif; font-size: 19px">{{k.name}}</span>
                      <span style="font-size: 17px; font-weight: 800">{{k.price}}</span>
                    </span>
                    <span style="font-size: 13px; color: #5A6B67; text-align: left">{{k.blurb}}</span>
                  </button>
                </template>
              </div>
              <a href="#" style="align-self: flex-start; font-size: 14px; font-weight: 800">Compare all packages</a>
            </section>

            <!-- 2 EVENT -->
            <section aria-labelledby="b2" style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
              <h2 id="b2" style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 24px">2. Your event</h2>
              <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
                <legend style="font-size: 14px; font-weight: 800; margin-bottom: 8px; padding: 0">What are you celebrating?</legend>
                <div style="display: flex; flex-wrap: wrap; gap: 8px">
                  <template data-sc="for" list="{{types}}" as="t" hint-placeholder-count="6">
                    <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
                  </template>
                </div>
              </fieldset>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="bk-celebrant" style="font-size: 14px; font-weight: 800">{{celebrantLabel}}</label>
                <input id="bk-celebrant" type="text" placeholder="{{celebrantPh}}" value="{{celebrant}}" onChange="{{onCelebrant}}" style="min-height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 16px; color: #294B49; box-sizing: border-box">
              </div>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="bk-date" style="font-size: 14px; font-weight: 800">Event date</label>
                  <input id="bk-date" type="date" value="{{date}}" onChange="{{onDate}}" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 16px; color: #294B49; box-sizing: border-box">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="bk-city" style="font-size: 14px; font-weight: 800">City or town <span style="font-weight: 600; color: #5A6B67">(optional)</span></label>
                  <input id="bk-city" type="text" placeholder="e.g. Quezon City" style="min-height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 16px; color: #294B49; box-sizing: border-box">
                </div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="bk-guests" style="font-size: 14px; font-weight: 800">About how many guests? <span style="font-weight: 600; color: #5A6B67">(optional)</span></label>
                <select id="bk-guests" style="min-height: 50px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 16px; color: #294B49; max-width: 320px">
                  <option>Not sure yet</option><option>Up to 50</option><option>50–100</option><option>100–200</option><option>More than 200</option>
                </select>
              </div>
            </section>

            <!-- 3 DESIGN -->
            <section aria-labelledby="bd" style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
                <h2 id="bd" style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 24px">3. Choose a design</h2>
                <span style="font-size: 13px; color: #5A6B67">{{tplFilterNote}}</span>
              </div>
              <template data-sc="if" value="{{isPersonalized}}" hint-placeholder-val="{{ false }}">
                <div style="padding: 16px; border-radius: 16px; background: #EDF1EC; display: flex; flex-direction: column; gap: 4px">
                  <span style="font-size: 16px; font-weight: 800">Your design is made just for you</span>
                  <span style="font-size: 14px; color: #5A6B67">With Personalized, we design your page from scratch. Tell us your theme, colors or a printed invitation to match in the notes below.</span>
                </div>
              </template>
              <template data-sc="if" value="{{showTemplates}}" hint-placeholder-val="{{ true }}">
                <div role="radiogroup" aria-labelledby="bd" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px">
                  <template data-sc="for" list="{{templates}}" as="tp" hint-placeholder-count="15">
                    <div style="{{tp.cardStyle}}">
                      <button type="button" role="radio" aria-checked="{{tp.on}}" onClick="{{tp.pick}}" style="padding: 0; border: 0; background: transparent; cursor: pointer; text-align: left; font-family: Nunito, sans-serif; color: #294B49; display: flex; flex-direction: column; gap: 10px">
                        <span aria-hidden="true" style="{{tp.cv.box}}">
            <span style="{{tp.cv.small}}">{{tp.small}}</span>
            <span style="{{tp.cv.title}}">{{tp.sample}}</span>
          </span>
                        <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 2px">
                          <span style="font-size: 16px; font-weight: 800">{{tp.name}}</span>
                          <template data-sc="if" value="{{tp.on}}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 8px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-size: 11px; font-weight: 800">SELECTED</span></template>
                        </span>
                        <span style="font-size: 13px; color: #5A6B67; padding: 0 2px">{{tp.tags}}</span>
                      </button>
                      <button type="button" onClick="{{tp.preview}}" style="align-self: flex-start; min-height: 36px; padding: 0 2px; border: 0; background: transparent; color: #356B68; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; text-decoration: underline; cursor: pointer">Preview design</button>
                    </div>
                  </template>
                </div>
                <button type="button" aria-pressed="{{tplUnsure}}" onClick="{{pickUnsure}}" style="{{unsureStyle}}">Not sure yet. Help me choose.</button>
                <span style="font-size: 13px; color: #5A6B67">You can change the design before your page goes live. Colors of your motif can be added later on your private link.</span>
              </template>
            </section>

            <!-- 3 YOU -->
            <section aria-labelledby="b3" style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
              <h2 id="b3" style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 24px">4. How we'll reach you</h2>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="bk-name" style="font-size: 14px; font-weight: 800">Your name</label>
                  <input id="bk-name" type="text" autocomplete="name" placeholder="e.g. Mia Santos" value="{{name}}" onChange="{{onName}}" style="min-height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 16px; color: #294B49; box-sizing: border-box">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="bk-mobile" style="font-size: 14px; font-weight: 800">Mobile number</label>
                  <input id="bk-mobile" type="tel" autocomplete="tel" placeholder="09XX XXX XXXX" value="{{mobile}}" onChange="{{onMobile}}" style="min-height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid {{mobileBorder}}; background: #FFFFFF; font-size: 16px; color: #294B49; box-sizing: border-box">
                  <template data-sc="if" value="{{mobileBad}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 700; color: #2B5653">Enter an 11-digit PH mobile number, e.g. 0917 123 4567.</span></template>
                </div>
              </div>
              <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
                <legend style="font-size: 14px; font-weight: 800; margin-bottom: 8px; padding: 0">Where should we send your private link?</legend>
                <div style="display: flex; flex-wrap: wrap; gap: 8px">
                  <template data-sc="for" list="{{channels}}" as="c" hint-placeholder-count="4">
                    <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
                  </template>
                </div>
              </fieldset>
              <template data-sc="if" value="{{needsFb}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="bk-fb" style="font-size: 14px; font-weight: 800">Your Facebook name</label>
                  <input id="bk-fb" type="text" placeholder="As it shows on Messenger" value="{{fb}}" onChange="{{onFb}}" style="min-height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 16px; color: #294B49; box-sizing: border-box">
                </div>
              </template>
              <template data-sc="if" value="{{needsEmail}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="bk-email" style="font-size: 14px; font-weight: 800">Email address</label>
                  <input id="bk-email" type="email" autocomplete="email" placeholder="you@example.com" value="{{email}}" onChange="{{onEmail}}" style="min-height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 16px; color: #294B49; box-sizing: border-box">
                </div>
              </template>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="bk-notes" style="font-size: 14px; font-weight: 800">Anything else? <span style="font-weight: 600; color: #5A6B67">(optional)</span></label>
                <textarea id="bk-notes" rows="3" placeholder="Theme, colors, a template you liked, or questions" style="padding: 12px 16px; border-radius: 12px; border: 1.5px solid #BFCBC2; background: #FFFFFF; font-size: 16px; color: #294B49; resize: vertical; box-sizing: border-box"></textarea>
              </div>
              <label for="bk-agree" style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer">
                <input id="bk-agree" type="checkbox" checked="{{agree}}" onChange="{{onAgree}}" style="width: 20px; height: 20px; margin-top: 2px; accent-color: {{accent}}">
                <span>I agree to the <a href="#">terms</a> and <a href="#">privacy policy</a>. Kumbida will use my details only to set up and support my event.</span>
              </label>
            </section>
          </div>

          <!-- SUMMARY -->
          <aside aria-label="Booking summary" style="flex: 1 1 320px; min-width: 0; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 14px">
            <div style="background: #294B49; color: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
              <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.1em; color: #C5A66B">YOUR BOOKING</span>
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
                <span style="font-family: Fraunces, serif; font-size: 26px">{{pkgName}}</span>
                <span style="font-size: 26px; font-weight: 800">{{pkgPrice}}</span>
              </div>
              <span style="font-size: 14px; color: #D7E0D9">{{summaryLine}}</span>
              <span style="font-size: 14px; color: #D7E0D9">Design: <strong style="color: #FFFFFF">{{tplName}}</strong></span>
              <span style="font-size: 13px; color: #B7C4BB">One-time price per event. You'll pay after we send your private link.</span>
            </div>
            <div style="background: #FFFFFF; border: 1.5px solid #DCE3DD; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
              <span style="font-size: 15px; font-weight: 800">What happens next</span>
              <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
                <li style="display: flex; gap: 10px"><span style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: #D7E0D9; color: #356B68; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center">1</span>We review your request, usually within [X hours].</li>
                <li style="display: flex; gap: 10px"><span style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: #D7E0D9; color: #356B68; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center">2</span>You get your private link by {{channelName}}.</li>
                <li style="display: flex; gap: 10px"><span style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: #D7E0D9; color: #356B68; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center">3</span>Pay via InstaPay or QR and upload your receipt.</li>
                <li style="display: flex; gap: 10px"><span style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: #D7E0D9; color: #356B68; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center">4</span>{{step4}}</li>
              </ol>
            </div>
            <button type="button" onClick="{{submit}}" disabled="{{disabled}}" style="{{submitStyle}}">Send booking request</button>
            <template data-sc="if" value="{{disabled}}" hint-placeholder-val="{{ true }}">
              <div style="padding: 12px 14px; border-radius: 12px; background: #EDF1EC; font-size: 14px; display: flex; flex-direction: column; gap: 4px">
                <span style="font-weight: 800">To send, please:</span>
                <template data-sc="for" list="{{missing}}" as="m" hint-placeholder-count="3"><span style="display: flex; gap: 8px; color: #34504D"><span aria-hidden="true" style="color: #356B68; font-weight: 800">○</span>{{m.label}}</span></template>
              </div>
            </template>
            <p style="margin: 0; font-size: 13px; color: #5A6B67; text-align: center">Prefer to chat? <a href="#">Message us on Messenger</a></p>
          </aside>
        </div>
      </div>
    </template>

    <!-- ===== SENT VIEW ===== -->
    <template data-sc="if" value="{{isSent}}" hint-placeholder-val="{{ false }}">
      <div style="max-width: 640px; margin: 20px auto; background: #FFFFFF; border: 1.5px solid #CFE3D8; border-radius: 26px; padding: 36px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start">
        <span aria-hidden="true" style="width: 60px; height: 60px; border-radius: 50%; background: #EEF5F1; color: #2F7A5A; display: flex; align-items: center; justify-content: center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
        </span>
        <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 36px; line-height: 1.1">Request received, {{firstName}}!</h1>
        <p style="margin: 0; font-size: 17px; color: #5A6B67">We'll review your booking and send your private link by <strong style="color: #294B49">{{channelName}}</strong> within [X hours].</p>
        <dl style="margin: 0; width: 100%; padding: 16px; border-radius: 16px; background: #EDF1EC; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
          <div style="display: flex; justify-content: space-between; gap: 10px"><dt style="color: #5A6B67">Request no.</dt><dd style="margin: 0; font-weight: 800">KB-1042</dd></div>
          <div style="display: flex; justify-content: space-between; gap: 10px"><dt style="color: #5A6B67">Package</dt><dd style="margin: 0; font-weight: 800">{{pkgName}} · {{pkgPrice}}</dd></div>
