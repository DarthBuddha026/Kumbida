<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Class Reunion invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Graduate&amp;family=Barlow:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4EFE4; color: #1F2D4A; font-family: Barlow, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 76px 30px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <defs><pattern id="ruled2" width="390" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27" x2="390" y2="27" stroke="#E0D6C2" stroke-width="1"/></pattern></defs>
    <rect width="390" height="844" fill="url(#ruled2)" opacity="0.7"/>
    <g transform="translate(18 300) rotate(-14)"><path d="M0 0 L110 22 L0 44 Z" fill="#B23A48"/><text x="12" y="27" font-family="Graduate, serif" font-size="12" fill="#FFFFFF">GO TEAM!</text><rect x="-6" y="-6" width="6" height="70" fill="#1F2D4A"/></g>
    <g transform="translate(320 470)" fill="none" stroke="#1F2D4A" stroke-width="2" stroke-linejoin="round"><path d="M0 -14 L36 -2 L0 10 L-36 -2 Z" fill="#1F2D4A"/><path d="M-20 4 V18 C -10 26, 10 26, 20 18 V4"/><path d="M30 0 V22"/><circle cx="30" cy="24" r="3" fill="#B23A48" stroke="none"/></g>
    <g fill="#B23A48" opacity="0.9"><rect x="40" y="80" width="8" height="4" transform="rotate(20 40 80)"/><rect x="340" y="120" width="8" height="4" transform="rotate(-30 340 120)"/><rect x="60" y="620" width="8" height="4" transform="rotate(40 60 620)"/><rect x="330" y="700" width="8" height="4" transform="rotate(10 330 700)"/><rect x="200" y="40" width="8" height="4" transform="rotate(-20 200 40)"/><rect x="110" y="760" width="8" height="4" transform="rotate(30 110 760)"/></g>
  </svg>

  <p style="position: relative; margin: 0; font-family: Graduate, serif; font-size: 14px; letter-spacing: 0.12em; padding: 6px 14px; border: 2px solid #1F2D4A">CLASS OF [YEAR]</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="margin-top: 6px; font-family: Graduate, serif; font-size: 44px; color: #B23A48">Together Again</span>
    <span style="margin-top: 10px; font-size: 18px; font-weight: 800; letter-spacing: 0.16em">[NUMBER]-YEAR REUNION</span>
  </h1>

  <div style="position: relative; margin-top: 26px; width: 300px; height: 200px">
    <div style="width: 100%; height: 100%; box-sizing: border-box; padding: 10px; background: #FFFFFF; border: 1.5px solid #D8CDB4; transform: rotate(1.5deg)">
      <div style="width: 100%; height: 100%; background: #E4E0D4; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1F2D4A">Class photo</div>
    </div>
  </div>

  <p style="position: relative; margin: 20px 0 0; font-size: 17px; font-weight: 600">Same batch, new stories. Bring your yearbook and your best throwback look!</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 15px; font-weight: 800">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px">[Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 8px; background: #1F2D4A; color: #FFFFFF; font-family: Graduate, serif; font-size: 14px; letter-spacing: 0.06em">RSVP BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
