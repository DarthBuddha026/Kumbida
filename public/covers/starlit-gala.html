<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Starlit Gala invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #101A33; color: #F2EFE8; font-family: Jost, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 92px 32px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <g stroke="#C9D3E6" stroke-width="0.8" opacity="0.6" fill="none"><path d="M40 90 L90 60 L140 80 L170 40"/><path d="M260 120 L300 80 L350 96 L330 150"/><path d="M30 620 L70 660 L50 720"/><path d="M330 640 L360 700 L320 740"/></g>
    <g fill="#C9D3E6"><circle cx="40" cy="90" r="2.5"/><circle cx="90" cy="60" r="2"/><circle cx="140" cy="80" r="2.5"/><circle cx="170" cy="40" r="2"/><circle cx="260" cy="120" r="2"/><circle cx="300" cy="80" r="2.5"/><circle cx="350" cy="96" r="2"/><circle cx="330" cy="150" r="2.5"/><circle cx="30" cy="620" r="2"/><circle cx="70" cy="660" r="2.5"/><circle cx="50" cy="720" r="2"/><circle cx="330" cy="640" r="2"/><circle cx="360" cy="700" r="2.5"/><circle cx="320" cy="740" r="2"/></g>
    <path transform="translate(56 300) scale(0.7)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#C9D3E6"/><path transform="translate(330 380) scale(0.9)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#C9D3E6"/><path transform="translate(190 800) scale(0.6)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#C9D3E6"/>
    <g fill="#FFFFFF" opacity="0.5"><circle cx="20" cy="200" r="1"/><circle cx="370" cy="240" r="1"/><circle cx="100" cy="520" r="1"/><circle cx="290" cy="560" r="1"/><circle cx="200" cy="20" r="1"/></g>
  </svg>

  <p style="position: relative; margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.34em; color: #C9D3E6">A NIGHT UNDER THE STARS</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: Italiana, serif; font-size: 54px">The Celebrant</span>
    <span style="margin-top: 12px; font-size: 14px; font-weight: 500; letter-spacing: 0.4em">TURNS EIGHTEEN</span>
  </h1>

  <div style="position: relative; margin-top: 30px; width: 210px; height: 270px; border-radius: 105px 105px 4px 4px; border: 1.5px solid #C9D3E6; padding: 8px; box-sizing: border-box">
    <div style="width: 100%; height: 100%; border-radius: 97px 97px 2px 2px; background: #1C2A4D; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #C9D3E6">Debutante's photo</div>
  </div>

  <p style="position: relative; margin: 20px 0 0; font-family: Italiana, serif; font-size: 20px">Join us for a night of stars, candles and eighteen wishes.</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px">[Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; border: 1.5px solid #C9D3E6; color: #C9D3E6; font-size: 13px; font-weight: 600; letter-spacing: 0.24em">RSVP BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
