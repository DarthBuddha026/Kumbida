<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Little Boss invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F1E7; color: #172340; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 0 26px">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 330px; background: #172340"></div>
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <g stroke="#C9A04A" stroke-width="1" opacity="0.4"><line x1="0" y1="20" x2="390" y2="20"/><line x1="0" y1="310" x2="390" y2="310"/></g>
    <g transform="translate(176 40)"><path d="M10 0 H28 L32 8 L24 14 L30 52 L19 62 L8 52 L14 14 L6 8 Z" fill="#C9A04A"/><path d="M14 14 L24 14" stroke="#172340" stroke-width="1.5"/></g>
  </svg>

  <p style="position: relative; margin: 112px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.28em; color: #C9A04A">MEMO · TO ALL STAFF</p>
  <h1 style="position: relative; margin: 10px 0 0; display: flex; flex-direction: column; line-height: 1; color: #FFFFFF; font-family: 'Playfair Display', serif">
    <span style="font-size: 26px; font-weight: 600">The Boss is turning</span>
    <span style="font-size: 92px; font-weight: 800; color: #C9A04A; line-height: 0.95">SEVEN</span>
  </h1>

  <div style="position: relative; margin-top: 8px; width: 180px; height: 180px; border-radius: 50%; border: 5px solid #C9A04A; background: #FFFFFF; padding: 6px; box-sizing: border-box">
    <div style="width: 100%; height: 100%; border-radius: 50%; background: #DCE3EF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #172340">Celebrant's photo</div>
  </div>
  <p style="position: relative; margin: 10px 0 0; font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700">Our Birthday Star, CEO</p>

  <div style="position: relative; margin-top: 16px; width: 100%; border-radius: 12px; background: #FFFFFF; border: 1px solid #DCD3BF; text-align: left; overflow: hidden">
    <div style="padding: 10px 16px; background: #EFE7D6; font-size: 12px; font-weight: 700; letter-spacing: 0.2em">MEETING AGENDA</div>
    <div style="padding: 10px 16px; display: grid; grid-template-columns: 70px 1fr; row-gap: 6px; font-size: 15px">
      <span style="font-weight: 700">Date</span><span>[Day], [Month Day, Year]</span>
      <span style="font-weight: 700">Time</span><span>[Time] sharp</span>
      <span style="font-weight: 700">Office</span><span>[Venue name], [City]</span>
      <span style="font-weight: 700">Items</span><span>Cake, games, ice cream</span>
    </div>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 16px; min-height: 50px; display: inline-flex; align-items: center; padding: 0 30px; border-radius: 8px; background: #172340; color: #FFFFFF; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-decoration: none; border-bottom: 4px solid #C9A04A">CONFIRM ATTENDANCE BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
