<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Love Letters invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Allura&amp;family=EB+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7EFE6; color: #2E3A57; font-family: 'EB Garamond', serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 118px 34px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <defs><pattern id="air" width="40" height="12" patternUnits="userSpaceOnUse" patternTransform="skewX(-40)"><rect width="10" height="12" fill="#B23A48"/><rect x="20" width="10" height="12" fill="#2E3A57"/></pattern></defs>
    <rect x="0" y="0" width="390" height="12" fill="url(#air)"/><rect x="0" y="832" width="390" height="12" fill="url(#air)"/>
    <g transform="translate(302 34)">
      <rect width="64" height="76" fill="#FFFFFF" stroke="#C9B9A6" stroke-dasharray="3 3"/>
      <rect x="8" y="8" width="48" height="60" fill="#F2D9D3"/>
      <path d="M32 50 C 18 40, 20 26, 28 26 C 30 26, 32 28, 32 30 C 32 28, 34 26, 36 26 C 44 26, 46 40, 32 50 Z" fill="#B23A48"/>
    </g>
    <g fill="none" stroke="#2E3A57" stroke-width="1" opacity="0.5"><circle cx="286" cy="90" r="24"/><path d="M256 84 q 10 -6 20 0 t 20 0 t 20 0 M256 96 q 10 -6 20 0 t 20 0 t 20 0"/></g>
    <g transform="translate(40 680)">
      <rect width="120" height="80" rx="4" fill="#FFFFFF" stroke="#D8C9B6"/>
      <path d="M0 0 L60 44 L120 0" fill="none" stroke="#D8C9B6"/>
      <circle cx="60" cy="44" r="14" fill="#B23A48"/><path d="M60 50 C 54 46, 55 40, 58 40 C 59 40, 60 41, 60 42 C 60 41, 61 40, 62 40 C 65 40, 66 46, 60 50 Z" fill="#F7EFE6"/>
    </g>
  </svg>

  <p style="position: relative; margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.3em">[NUMBER] YEARS OF LOVE LETTERS</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: Allura, cursive; font-size: 62px; color: #B23A48; line-height: 1.1">The Happy Couple</span>
    <span style="margin-top: 8px; font-size: 22px; font-style: italic">are still writing their story</span>
  </h1>

  <div style="position: relative; margin-top: 24px; width: 220px; height: 240px; background: #FFFFFF; padding: 10px; box-sizing: border-box; transform: rotate(-2deg); box-shadow: 0 10px 22px rgba(46, 58, 87, 0.15)">
    <div style="width: 100%; height: 100%; background: #E9E1D6; display: flex; align-items: center; justify-content: center; font-size: 16px; font-style: italic; color: #2E3A57">Couple's photo</div>
  </div>

  <p style="position: relative; margin: 20px 0 0; font-size: 19px; font-style: italic">Come celebrate [Number] years, and many more chapters to come.</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 17px">[Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; background: #2E3A57; color: #FFFFFF; font-family: 'EB Garamond', serif; font-size: 15px; font-weight: 600; letter-spacing: 0.16em">RSVP BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
