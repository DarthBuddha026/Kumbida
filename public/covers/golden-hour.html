<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Golden Hour wedding invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #22304A; color: #F4EEE2; font-family: Nunito, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 64px 32px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <rect x="0" y="560" width="390" height="284" fill="#1A2539"/>
    <circle cx="195" cy="560" r="150" fill="#F2D38B" opacity="0.10"/>
    <circle cx="195" cy="560" r="110" fill="#F2D38B" opacity="0.14"/>
    <path d="M115 560 A80 80 0 0 1 275 560 Z" fill="#F2D38B"/>
    <g stroke="#F2D38B" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <line x1="195" y1="460" x2="195" y2="430"/><line x1="140" y1="480" x2="122" y2="456"/><line x1="250" y1="480" x2="268" y2="456"/>
      <line x1="104" y1="520" x2="78" y2="508"/><line x1="286" y1="520" x2="312" y2="508"/>
    </g>
    <line x1="0" y1="560" x2="390" y2="560" stroke="#F2D38B" stroke-width="1"/>
    <g stroke="#F2D38B" stroke-linecap="round" opacity="0.55">
      <line x1="135" y1="580" x2="255" y2="580" stroke-width="3"/>
      <line x1="150" y1="598" x2="240" y2="598" stroke-width="2.5"/>
      <line x1="165" y1="614" x2="225" y2="614" stroke-width="2"/>
      <line x1="180" y1="628" x2="210" y2="628" stroke-width="1.5"/>
    </g>
    <rect x="22" y="22" width="346" height="800" rx="4" fill="none" stroke="#F2D38B" stroke-width="1" opacity="0.6"/>
    <g fill="#F2D38B"><circle cx="60" cy="70" r="2"/><circle cx="330" cy="110" r="2.5"/><circle cx="300" cy="56" r="1.5"/><circle cx="80" cy="200" r="1.5"/><circle cx="340" cy="260" r="1.5"/></g>
  </svg>

  <p style="position: relative; margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.3em; color: #E8E2D2">AS THE SUN SETS</p>
  <h1 style="position: relative; margin: 14px 0 0; display: flex; flex-direction: column; line-height: 1; font-family: Fraunces, serif; font-weight: 400">
    <span style="font-size: 48px; font-style: italic; color: #F2D38B">The Happy Couple</span>
    <span style="margin-top: 12px; font-size: 20px">will say I do</span>
  </h1>

  <div style="position: relative; margin-top: 26px; width: 180px; height: 200px; border-radius: 90px 90px 4px 4px; border: 1.5px solid #F2D38B; padding: 7px; box-sizing: border-box">
    <div style="width: 100%; height: 100%; border-radius: 84px 84px 2px 2px; background: #33415C; display: flex; align-items: center; justify-content: center; font-family: Fraunces, serif; font-style: italic; font-size: 15px; color: #E8E2D2">Couple's photo</div>
  </div>

  <div style="position: relative; margin-top: 236px; display: flex; flex-direction: column; gap: 3px">
    <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.16em; color: #F2D38B">[DAY] · [MONTH DAY, YEAR]</span>
    <span style="font-size: 16px; font-weight: 500">[Time] · [Venue name], [City]</span>
    <span style="margin-top: 4px; font-family: Fraunces, serif; font-style: italic; font-size: 17px; color: #E8E2D2">Ceremony at golden hour, dinner and dancing to follow</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; border-radius: 999px; background: #F2D38B; color: #22304A; font-size: 14px; font-weight: 800; letter-spacing: 0.12em; text-decoration: none">RSVP BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
