<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Family Tree invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,600;0,800;1,600&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAF5EA; color: #3D3A26; font-family: Nunito, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 300px 30px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <circle cx="195" cy="150" r="90" fill="#7FA86A"/><circle cx="120" cy="190" r="60" fill="#94B97C"/><circle cx="270" cy="190" r="60" fill="#94B97C"/><circle cx="150" cy="110" r="50" fill="#A8C98F"/><circle cx="240" cy="110" r="50" fill="#A8C98F"/><circle cx="195" cy="80" r="44" fill="#BCD7A3"/>
    <path d="M183 330 L183 230 C 170 210, 150 200, 130 196 M207 330 L207 230 C 220 210, 240 200, 262 196 M195 250 L195 160" fill="none" stroke="#7A5A3A" stroke-width="10" stroke-linecap="round"/>
    <rect x="178" y="230" width="34" height="80" fill="#7A5A3A"/>
    <g fill="#E3A44B"><circle cx="130" cy="150" r="7"/><circle cx="260" cy="160" r="7"/><circle cx="195" cy="100" r="7"/><circle cx="160" cy="230" r="6"/><circle cx="236" cy="226" r="6"/></g>
    <path d="M0 844 V770 C 90 754, 200 780, 390 760 V844 Z" fill="#CFE0BD"/>
  </svg>

  <p style="position: relative; margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.26em">THE [FAMILY NAME] FAMILY</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: Alegreya, serif; font-weight: 800; font-size: 52px; color: #4F6B3A">Together Again</span>
    <span style="margin-top: 8px; font-family: Alegreya, serif; font-style: italic; font-weight: 600; font-size: 22px">family reunion</span>
  </h1>

  <div style="position: relative; margin-top: 22px; width: 300px; height: 170px; border-radius: 18px; border: 6px solid #FFFFFF; box-shadow: 0 0 0 2px #CFE0BD; background: #EDE6D2; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #5E5A3E; box-sizing: border-box">Family photo</div>

  <p style="position: relative; margin: 20px 0 0; font-size: 17px; font-weight: 600">Lolas, titos, cousins and the newest little ones. Everyone’s coming home.</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 15px; font-weight: 800">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px">[Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; background: #4F6B3A; color: #FFFFFF; font-size: 16px; font-weight: 800">RSVP by [Date]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
