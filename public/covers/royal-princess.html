<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Royal Princess invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F3ECF9; color: #4B2C6B; font-family: 'Cormorant Garamond', serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 40px 28px 0">
  <svg aria-hidden="true" width="390" height="230" viewBox="0 0 390 230" style="position: absolute; left: 0; bottom: 0">
    <path d="M0 230 V170 H40 V120 L55 95 L70 120 V170 H110 V140 H130 V100 L150 60 L170 100 V140 H220 V100 L240 60 L260 100 V140 H280 V170 H320 V120 L335 95 L350 120 V170 H390 V230 Z" fill="#E2D3F1"/>
    <path d="M150 230 V190 a45 45 0 0 1 90 0 V230 Z" fill="#CDB6E6"/>
    <rect x="148" y="112" width="8" height="14" rx="4" fill="#CDB6E6"/><rect x="234" y="112" width="8" height="14" rx="4" fill="#CDB6E6"/>
    <path d="M150 60 V40 L165 46 L150 52" fill="#B8892E"/><path d="M240 60 V40 L255 46 L240 52" fill="#B8892E"/>
  </svg>
  <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" style="position: absolute; left: 36px; top: 70px; fill: #B8892E"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg>
  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="position: absolute; right: 40px; top: 110px; fill: #B8892E"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg>
  <svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" style="position: absolute; right: 70px; top: 330px; fill: #B79BD8"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg>

  <svg aria-hidden="true" width="84" height="40" viewBox="0 0 84 40" style="position: relative"><path d="M4 34 L10 8 L26 24 L42 2 L58 24 L74 8 L80 34 Z" fill="none" stroke="#B8892E" stroke-width="3" stroke-linejoin="round"/><circle cx="42" cy="2" r="3" fill="#B8892E"/><circle cx="10" cy="8" r="2.5" fill="#B8892E"/><circle cx="74" cy="8" r="2.5" fill="#B8892E"/><rect x="4" y="34" width="76" height="4" rx="2" fill="#B8892E"/></svg>
  <p style="position: relative; margin: 14px 0 0; font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.28em">YOU ARE ROYALLY INVITED</p>
  <h1 style="position: relative; margin: 6px 0 0; display: flex; flex-direction: column; line-height: 1">
    <span style="font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 58px; color: #6A3D96">Birthday Star</span>
    <span style="margin-top: 6px; font-family: Cinzel, serif; font-size: 20px; font-weight: 700; letter-spacing: 0.12em">TURNS ONE</span>
  </h1>

  <div style="position: relative; margin-top: 22px; width: 190px; height: 230px; border-radius: 95px 95px 10px 10px; border: 4px solid #B8892E; padding: 6px; box-sizing: border-box; background: #FFFFFF">
    <div style="width: 100%; height: 100%; border-radius: 88px 88px 6px 6px; background: #E6D8F3; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #6A3D96">Celebrant's photo</div>
  </div>

  <p style="position: relative; margin: 18px 0 0; font-size: 20px; font-style: italic">Join us for a royal birthday celebration</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-family: Cinzel, serif; font-size: 14px; font-weight: 700; letter-spacing: 0.14em">[DAY] · [MONTH DAY, YEAR]</span>
    <span style="font-size: 18px; font-weight: 600">[Time] · [Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 28px; border-radius: 999px; background: #6A3D96; color: #FFFFFF; font-family: Cinzel, serif; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-decoration: none; box-shadow: 0 0 0 3px #F3ECF9, 0 0 0 5px #B8892E">RSVP BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
