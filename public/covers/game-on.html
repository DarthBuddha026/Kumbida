<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Game On invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0F1420; color: #E8F0FF; font-family: 'Chakra Petch', sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 70px 28px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0 H0 V26" fill="none" stroke="#1C2538" stroke-width="1"/></pattern></defs>
    <rect width="390" height="844" fill="url(#grid)"/>
    <g fill="none" stroke="#3DF5A6" stroke-width="3"><path d="M14 44 V14 H44"/><path d="M346 14 H376 V44"/><path d="M14 800 V830 H44"/><path d="M346 830 H376 V800"/></g>
    <g fill="#FF4F7B"><path d="M30 30 h4 v-4 h4 v4 h4 v-4 h4 v4 h4 v8 h-4 v4 h-4 v4 h-4 v4 h-4 v-4 h-4 v-4 h-4 v-4 h-4 Z" transform="translate(6 10) scale(0.7)"/><path d="M30 30 h4 v-4 h4 v4 h4 v-4 h4 v4 h4 v8 h-4 v4 h-4 v4 h-4 v4 h-4 v-4 h-4 v-4 h-4 v-4 h-4 Z" transform="translate(34 10) scale(0.7)"/><path d="M30 30 h4 v-4 h4 v4 h4 v-4 h4 v4 h4 v8 h-4 v4 h-4 v4 h-4 v4 h-4 v-4 h-4 v-4 h-4 v-4 h-4 Z" transform="translate(62 10) scale(0.7)"/></g>
    <rect x="250" y="30" width="110" height="10" rx="2" fill="#1C2538" stroke="#2E3A55"/><rect x="250" y="30" width="80" height="10" rx="2" fill="#3DF5A6"/>
    <g transform="translate(195 770)">
      <path d="M-90 -10 C -90 -40, -60 -44, -40 -36 L 40 -36 C 60 -44, 90 -40, 90 -10 C 92 24, 70 40, 54 22 L 36 4 L -36 4 L -54 22 C -70 40, -92 24, -90 -10 Z" fill="#1C2538" stroke="#2E3A55" stroke-width="2"/>
      <path d="M-58 -22 h8 v-8 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8 Z" fill="#E8F0FF" opacity="0.8"/>
      <circle cx="46" cy="-24" r="6" fill="#3DF5A6"/><circle cx="60" cy="-12" r="6" fill="#FF4F7B"/><circle cx="32" cy="-12" r="6" fill="#4FA8FF"/><circle cx="46" cy="0" r="6" fill="#F5C542"/>
    </g>
  </svg>

  <p style="position: relative; margin: 0; font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 0.08em; color: #3DF5A6">PLAYER 1 · READY</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: 0.02em">BIRTHDAY STAR</span>
    <span style="margin-top: 12px; font-family: 'Press Start 2P', monospace; font-size: 12px; color: #3DF5A6">LEVEL 13 UNLOCKED</span>
  </h1>

  <div style="position: relative; margin-top: 26px; width: 210px; height: 210px; border-radius: 6px; border: 3px solid #3DF5A6; box-shadow: 0 0 16px rgba(61, 245, 166, 0.35); background: #1C2538; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #9FB0CC">Player's photo</div>

  <p style="position: relative; margin: 20px 0 0; font-size: 17px; font-weight: 500">New level, new loot. Join the squad for an epic birthday.</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; padding: 12px 18px; border: 1.5px solid #2E3A55; background: #151C2C; border-radius: 6px">
    <span style="font-size: 15px; font-weight: 600">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px">[Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 6px; background: #3DF5A6; color: #0F1420; font-family: 'Press Start 2P', monospace; font-size: 11px">PRESS START TO RSVP</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
