<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Race Day invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&amp;family=Barlow:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #1E2430; color: #FFFFFF; font-family: Barlow, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 0 26px">
  <svg aria-hidden="true" width="390" height="40" viewBox="0 0 390 40" style="position: absolute; left: 0; top: 0">
    <defs><pattern id="chk" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#FFFFFF"/><rect width="10" height="10" fill="#111111"/><rect x="10" y="10" width="10" height="10" fill="#111111"/></pattern></defs>
    <rect width="390" height="40" fill="url(#chk)"/>
  </svg>
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <path d="M-20 640 C 80 560, 300 700, 410 600" fill="none" stroke="#2E3646" stroke-width="70"/>
    <path d="M-20 640 C 80 560, 300 700, 410 600" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="18 14" opacity="0.5"/>
    <g opacity="0.35" stroke="#FFC22E" stroke-width="4" stroke-linecap="round"><line x1="20" y1="300" x2="70" y2="300"/><line x1="10" y1="316" x2="50" y2="316"/><line x1="330" y1="340" x2="380" y2="340"/></g>
  </svg>

  <p style="position: relative; margin: 72px 0 0; font-size: 13px; font-weight: 800; letter-spacing: 0.3em; color: #FFC22E">START YOUR ENGINES</p>
  <h1 style="position: relative; margin: 8px 0 0; display: flex; flex-direction: column; line-height: 0.95; font-weight: 400">
    <span style="font-family: 'Racing Sans One', sans-serif; font-size: 70px; font-style: italic">RACE DAY</span>
    <span style="margin-top: 8px; font-size: 22px; font-weight: 700">Our Birthday Star turns one!</span>
  </h1>

  <div style="position: relative; margin-top: 22px; width: 300px; height: 190px">
    <div style="position: absolute; left: 50px; top: 0; width: 200px; height: 150px; border-radius: 14px; border: 4px solid #FFC22E; background: #2E3646; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #C8D0DC">Celebrant's photo</div>
    <div style="position: absolute; right: 18px; top: -16px; width: 62px; height: 62px; border-radius: 50%; background: #FFFFFF; color: #1E2430; border: 4px solid #FFC22E; display: flex; align-items: center; justify-content: center; font-family: 'Racing Sans One', sans-serif; font-size: 34px; box-sizing: border-box">1</div>
    <svg aria-hidden="true" width="170" height="64" viewBox="0 0 170 64" style="position: absolute; left: 0; bottom: 0">
      <path d="M10 44 L18 28 C 22 22, 30 20, 40 20 L72 20 L92 8 L122 8 L136 22 L156 26 C 162 28, 164 34, 164 40 L164 44 Z" fill="#FFC22E"/>
      <path d="M78 20 L94 12 L118 12 L128 20 Z" fill="#9CD5FF"/>
      <text x="48" y="38" font-family="Barlow, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">01</text>
      <circle cx="42" cy="46" r="13" fill="#111111"/><circle cx="42" cy="46" r="5" fill="#C8D0DC"/>
      <circle cx="136" cy="46" r="13" fill="#111111"/><circle cx="136" cy="46" r="5" fill="#C8D0DC"/>
    </svg>
  </div>

  <div style="position: relative; margin-top: 22px; width: 100%; border-radius: 14px; background: #FFFFFF; color: #1E2430; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden">
    <span style="padding: 12px; display: flex; flex-direction: column; border-right: 2px dashed #C8D0DC"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: #6A7385">RACE DATE</span><span style="font-size: 17px; font-weight: 800">[Month Day, Year]</span></span>
    <span style="padding: 12px; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: #6A7385">GREEN FLAG</span><span style="font-size: 17px; font-weight: 800">[Time]</span></span>
    <span style="grid-column: 1 / -1; padding: 10px 12px; border-top: 2px dashed #C8D0DC; font-size: 15px; font-weight: 700">PIT STOP: [Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 52px; display: inline-flex; align-items: center; padding: 0 30px; border-radius: 10px; background: #FFC22E; color: #1E2430; font-size: 17px; font-weight: 800; letter-spacing: 0.08em; text-decoration: none; transform: skewX(-8deg)">RSVP BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
