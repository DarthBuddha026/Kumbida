<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Street Court invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #1E1E24; color: #FFFFFF; font-family: Barlow, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 70px 28px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <g fill="none" stroke="#3A3A44" stroke-width="3">
      <rect x="110" y="660" width="170" height="200"/>
      <path d="M110 660 A85 85 0 0 1 280 660"/>
      <path d="M20 860 V700 A175 175 0 0 1 370 700 V860"/>
    </g>
    <g transform="translate(320 120)">
      <circle r="40" fill="#F26B1D"/>
      <g fill="none" stroke="#1E1E24" stroke-width="2.5"><line x1="-40" y1="0" x2="40" y2="0"/><line x1="0" y1="-40" x2="0" y2="40"/><path d="M-28 -28 C -10 -10, -10 10, -28 28"/><path d="M28 -28 C 10 -10, 10 10, 28 28"/></g>
    </g>
    <g transform="translate(46 40)">
      <rect x="-30" y="-6" width="60" height="6" fill="#FFFFFF"/>
      <path d="M-22 0 L-16 40 L16 40 L22 0" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <path d="M-20 10 L20 10 M-18 22 L18 22 M-16 34 L16 34 M-14 0 L-6 40 M0 0 L0 40 M14 0 L6 40" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
    </g>
  </svg>

  <p style="position: relative; margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.3em; color: #F26B1D">GAME DAY</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: 'Bebas Neue', sans-serif; font-size: 72px; letter-spacing: 0.02em; line-height: 0.9">BIRTHDAY STAR</span>
    <span style="margin-top: 6px; font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 0.06em; color: #F26B1D">TURNS 17</span>
  </h1>

  <div style="position: relative; margin-top: 20px; width: 210px; height: 230px">
    <div style="width: 100%; height: 100%; box-sizing: border-box; border: 4px solid #FFFFFF; background: #2C2C34; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #C9C9D2">Celebrant's photo</div>
    <span style="position: absolute; right: -18px; bottom: -16px; width: 64px; height: 64px; border-radius: 50%; background: #F26B1D; color: #1E1E24; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 34px">#17</span>
  </div>

  <p style="position: relative; margin: 20px 0 0; font-size: 17px; font-weight: 500">Bring your A-game, your crew and your appetite.</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 16px; font-weight: 700; letter-spacing: 0.02em">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px; color: #C9C9D2">[Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 6px; background: #F26B1D; color: #1E1E24; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.08em">RSVP BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
