<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Golden Years invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #1F3A33; color: #F3ECDD; font-family: 'Cormorant Garamond', serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 100px 34px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <rect x="20" y="20" width="350" height="804" fill="none" stroke="#D4AF62" stroke-width="1"/>
    <g transform="translate(195 330)" fill="none" stroke="#D4AF62" stroke-width="1.5">
      <path d="M-120 60 C -150 0, -140 -70, -96 -120"/><path d="M120 60 C 150 0, 140 -70, 96 -120"/>
    </g>
    <g fill="#D4AF62"><ellipse cx="63" cy="390" rx="11" ry="5" transform="rotate(-60 63 390)"/><ellipse cx="327" cy="390" rx="11" ry="5" transform="rotate(60 327 390)"/><ellipse cx="65" cy="364" rx="11" ry="5" transform="rotate(-52 65 364)"/><ellipse cx="325" cy="364" rx="11" ry="5" transform="rotate(52 325 364)"/><ellipse cx="67" cy="338" rx="11" ry="5" transform="rotate(-44 67 338)"/><ellipse cx="323" cy="338" rx="11" ry="5" transform="rotate(44 323 338)"/><ellipse cx="69" cy="312" rx="11" ry="5" transform="rotate(-36 69 312)"/><ellipse cx="321" cy="312" rx="11" ry="5" transform="rotate(36 321 312)"/><ellipse cx="71" cy="286" rx="11" ry="5" transform="rotate(-28 71 286)"/><ellipse cx="319" cy="286" rx="11" ry="5" transform="rotate(28 319 286)"/><ellipse cx="73" cy="260" rx="11" ry="5" transform="rotate(-20 73 260)"/><ellipse cx="317" cy="260" rx="11" ry="5" transform="rotate(20 317 260)"/><ellipse cx="75" cy="234" rx="11" ry="5" transform="rotate(-12 75 234)"/><ellipse cx="315" cy="234" rx="11" ry="5" transform="rotate(12 315 234)"/></g>
    <path transform="translate(60 760) scale(0.6)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#D4AF62"/><path transform="translate(318 70) scale(0.6)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#D4AF62"/>
  </svg>

  <p style="position: relative; margin: 0; font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.28em; color: #D4AF62">CELEBRATING [NUMBER] YEARS</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: Cinzel, serif; font-size: 40px; font-weight: 500; letter-spacing: 0.04em">The Happy Couple</span>
    <span style="margin-top: 10px; font-size: 22px; font-style: italic">a lifetime of love</span>
  </h1>

  <div style="position: relative; margin-top: 28px; width: 200px; height: 200px; border-radius: 50%; border: 1.5px solid #D4AF62; padding: 8px; box-sizing: border-box">
    <div style="width: 100%; height: 100%; border-radius: 50%; background: #2B4A42; display: flex; align-items: center; justify-content: center; font-size: 16px; font-style: italic; color: #D9D2C0">Couple's photo</div>
  </div>

  <p style="position: relative; margin: 20px 0 0; font-size: 20px; font-style: italic">Join us as we raise a glass to [Number] years together.</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 17px">[Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; background: #D4AF62; color: #1F3A33; font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em">RSVP BY [DATE]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
