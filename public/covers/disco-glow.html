<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Disco Glow invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh}
body.card{align-items:center;background:#E9E5DA}
body.card>div:first-child{border-radius:24px;box-shadow:0 24px 60px rgba(30,56,54,.25)}
</style>
</head>
<body><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #1B1035; color: #FFFFFF; font-family: Poppins, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; padding: 150px 28px 0">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <line x1="300" y1="0" x2="300" y2="40" stroke="#8C7BB8" stroke-width="1.5"/>
    <g transform="translate(300 80)">
      <circle r="40" fill="#C9C3DD"/>
      <g stroke="#8C7BB8" stroke-width="1" fill="none"><ellipse rx="40" ry="14"/><ellipse rx="40" ry="28"/><line x1="0" y1="-40" x2="0" y2="40"/><ellipse rx="14" ry="40"/><ellipse rx="28" ry="40"/></g>
      <rect x="-22" y="-26" width="9" height="9" fill="#FFFFFF"/><rect x="6" y="-14" width="8" height="8" fill="#FF5FD2"/><rect x="-10" y="8" width="8" height="8" fill="#FFFFFF" opacity="0.8"/>
    </g>
    <g stroke="#FF5FD2" stroke-width="2" opacity="0.5"><line x1="300" y1="80" x2="60" y2="260"/><line x1="300" y1="80" x2="130" y2="320"/><line x1="300" y1="80" x2="380" y2="300"/></g>
    <path transform="translate(52 60) scale(0.9)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FF5FD2"/><path transform="translate(150 40) scale(0.5)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/><path transform="translate(30 420) scale(0.6)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/><path transform="translate(350 470) scale(0.7)" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FF5FD2"/>
    <g stroke="#FF5FD2" stroke-width="1.5" opacity="0.35">
      <line x1="0" y1="760" x2="390" y2="760"/><line x1="0" y1="790" x2="390" y2="790"/><line x1="0" y1="826" x2="390" y2="826"/>
      <line x1="195" y1="740" x2="195" y2="844"/><line x1="195" y1="740" x2="80" y2="844"/><line x1="195" y1="740" x2="310" y2="844"/><line x1="195" y1="740" x2="-40" y2="844"/><line x1="195" y1="740" x2="430" y2="844"/>
    </g>
  </svg>

  <p style="position: relative; margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.26em; color: #FF5FD2">LET’S DANCE ALL NIGHT</p>
  <h1 style="position: relative; margin: 12px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 400">
    <span style="font-family: Righteous, sans-serif; font-size: 50px; color: #FFFFFF; text-shadow: 0 0 10px #FF5FD2, 0 0 24px #FF5FD2">Birthday Star</span>
    <span style="margin-top: 10px; font-size: 20px; font-weight: 600">turns sweet 16</span>
  </h1>

  <div style="position: relative; margin-top: 26px; width: 210px; height: 240px; border-radius: 20px; border: 3px solid #FF5FD2; box-shadow: 0 0 18px #FF5FD2; background: #2A1B4D; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #D9D0F0">Celebrant's photo</div>

  <p style="position: relative; margin: 20px 0 0; font-size: 17px; font-weight: 500">Glitter, lights and the best playlist. Dress to shine!</p>
  <div style="position: relative; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; ">
    <span style="font-size: 15px; font-weight: 600">[Day], [Month Day, Year] · [Time]</span>
    <span style="font-size: 15px">[Venue name], [City]</span>
  </div>
  <span aria-disabled="true" style="position: relative; margin-top: 18px; min-height: 48px; display: inline-flex; align-items: center; padding: 0 30px; text-decoration: none; border-radius: 999px; background: #FF5FD2; color: #1B1035; font-size: 16px; font-weight: 700">RSVP by [Date]</span>
</div>
<script>
(function () {
  if (window.self !== window.top) return;
  var b = document.body, c = b.firstElementChild;
  function fit() {
    var w = innerWidth, h = innerHeight, phone = w < 600;
    b.classList.toggle("card", !phone);
    c.style.zoom = phone ? w / 390 : Math.min((w * 0.94) / 390, (h * 0.94) / 844);
    var bg = getComputedStyle(c).backgroundColor;
    b.style.background = phone && bg !== "rgba(0, 0, 0, 0)" ? bg : "";
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
